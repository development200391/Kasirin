<svg width="750" height="1080" viewBox="0 0 750 1080" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
<rect width="750" height="1080" fill="#FFFFFF"/>

<!-- app bar -->
<rect x="0" y="0" width="750" height="112" fill="#FFFFFF"/>
<line x1="0" y1="112" x2="750" y2="112" stroke="#E2E8F0" stroke-width="2"/>
<path d="M56,40 L38,56 L56,72" fill="none" stroke="#0F172A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="84" y="68" fill="#0F172A" font-size="30" font-weight="bold">Backup &amp; Restore Database</text>

<!-- backup sekarang -->
<rect x="29" y="136" width="692" height="88" rx="20" fill="#4F46E5"/>
<ellipse cx="330" cy="168" rx="16" ry="6" fill="none" stroke="#FFFFFF" stroke-width="2.2"/>
<path d="M314,168 L314,196 Q314,202 330,202 Q346,202 346,196 L346,168" fill="none" stroke="#FFFFFF" stroke-width="2.2"/>
<text x="370" y="190" fill="#FFFFFF" font-size="27" font-weight="bold">Backup Sekarang</text>

<!-- deskripsi -->
<text x="29" y="252" fill="#94A3B8" font-size="20">Menyimpan salinan database saat ini ke penyimpanan lokal perangkat.</text>
<text x="29" y="278" fill="#94A3B8" font-size="20">Gunakan tombol "Bagikan" pada tiap backup untuk mengunggah ke</text>
<text x="29" y="304" fill="#94A3B8" font-size="20">Google Drive atau layanan lain.</text>

<!-- import file backup -->
<rect x="29" y="330" width="692" height="80" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
<path d="M330,382 L330,354 M320,364 L330,354 L340,364" fill="none" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="316" y1="382" x2="344" y2="382" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round"/>
<text x="360" y="380" fill="#4F46E5" font-size="25" font-weight="bold">Import File Backup</text>

<!-- riwayat backup -->
<text x="29" y="454" fill="#0F172A" font-size="29" font-weight="bold">Riwayat Backup</text>

<!-- entry 1: manual -->
<rect x="29" y="486" width="692" height="130" rx="25" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
<rect x="54" y="511" width="80" height="80" rx="22" fill="#F8FAFC"/>
<rect x="80" y="533" width="28" height="36" rx="3" fill="none" stroke="#4F46E5" stroke-width="2.2"/>
<line x1="86" y1="545" x2="102" y2="545" stroke="#4F46E5" stroke-width="2"/>
<line x1="86" y1="554" x2="102" y2="554" stroke="#4F46E5" stroke-width="2"/>
<text x="159" y="538" fill="#0F172A" font-size="25" font-weight="bold">22 Jul 2026, 14:00</text>
<rect x="159" y="556" width="88" height="32" rx="16" fill="#DCFCE7"/>
<text x="203" y="577" text-anchor="middle" fill="#16A34A" font-size="18" font-weight="bold">Manual</text>
<text x="262" y="578" fill="#94A3B8" font-size="22">4.2 MB</text>
<path d="M600,536 L600,564 M591,545 L600,536 L609,545 M591,558 L609,558" fill="none" stroke="#94A3B8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="696" y="578" text-anchor="end" fill="#4F46E5" font-size="24" font-weight="bold">Restore</text>

<!-- entry 2: manual -->
<rect x="29" y="634" width="692" height="130" rx="25" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
