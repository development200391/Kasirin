<text x="274" y="1022" fill="#94A3B8" font-size="22">3.9 MB</text>
<path d="M600,980 L600,1008 M591,989 L600,980 L609,989 M591,1002 L609,1002" fill="none" stroke="#94A3B8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
