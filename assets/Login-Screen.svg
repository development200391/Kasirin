<svg width="750" height="1624" viewBox="0 0 750 1624" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="logoGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <rect width="750" height="1624" fill="url(#bgG)"/>

  <!-- card -->
  <rect x="40" y="520" width="670" height="664" rx="48" fill="#FFFFFF"/>

  <!-- logo badge (assets/logo.png in a white rounded frame) -->
  <g transform="translate(275,420) scale(0.19531)">
    <rect width="1024" height="1024" rx="230" fill="url(#logoGrad2)" stroke="#FFFFFF" stroke-width="14"/>
    <rect x="360" y="300" width="80" height="424" rx="16" fill="#FFFFFF"/>
    <path d="M440,512 L660,300 L560,300 L440,430 Z" fill="#FFFFFF"/>
    <path d="M440,512 L660,724 L560,724 L440,590 Z" fill="#FFFFFF"/>
    <circle cx="700" cy="512" r="34" fill="#FBBF24"/>
  </g>

  <text x="375" y="660" text-anchor="middle" fill="#4F46E5" font-size="26" font-weight="bold" letter-spacing="3">KASIRIN</text>
  <text x="375" y="715" text-anchor="middle" fill="#0F172A" font-size="38" font-weight="bold">Selamat Datang</text>
  <text x="375" y="750" text-anchor="middle" fill="#64748B" font-size="20">Masuk untuk melanjutkan</text>

  <!-- username field -->
  <rect x="90" y="800" width="590" height="90" rx="20" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <circle cx="122" cy="837" r="9" fill="none" stroke="#94A3B8" stroke-width="3"/>
  <path d="M104,868 Q122,846 140,868" fill="none" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
  <text x="155" y="854" fill="#94A3B8" font-size="22">Username</text>

  <!-- password field -->
  <rect x="90" y="915" width="590" height="90" rx="20" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="110" y="950" width="24" height="20" rx="4" fill="none" stroke="#94A3B8" stroke-width="3"/>
  <path d="M114,950 v-8 a8,8 0 0 1 16,0 v8" fill="none" stroke="#94A3B8" stroke-width="3"/>
  <text x="155" y="969" fill="#94A3B8" font-size="22">Kata Sandi</text>
  <path d="M604,960 q26,-20 52,0 q-26,20 -52,0 Z" fill="none" stroke="#94A3B8" stroke-width="2.5"/>
  <circle cx="630" cy="960" r="7" fill="none" stroke="#94A3B8" stroke-width="2.5"/>

  <!-- submit button -->
  <rect x="90" y="1030" width="590" height="96" rx="24" fill="#4F46E5"/>
  <text x="375" y="1088" text-anchor="middle" fill="#FFFFFF" font-size="30" font-weight="bold">Masuk</text>
</svg>
